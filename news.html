<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualite | VeiLCL</title>
    <meta name="description" content="Analyse detaillee d'un signal strategique VeiLCL." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <div class="page-bg"></div>
    <header class="topbar">
      <nav class="nav container" aria-label="Navigation principale">
        <a class="brand-wrap brand-link" href="index.html#top" aria-label="Retour a l'accueil VeiLCL">
          <div class="brand-mark">V</div>
          <span class="brand-name">VEILCL</span>
        </a>
        <form class="header-search" role="search" action="index.html#empty-card" method="get">
          <label class="visually-hidden" for="header-search">Rechercher dans les sources</label>
          <svg class="header-search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input id="header-search" name="q" type="search" placeholder="Ask or search across sources" autocomplete="off" />
          <button class="search-clear" type="button" aria-label="Effacer la recherche" data-search-clear hidden>&times;</button>
        </form>
        <div class="nav-links">
          <a href="index.html#empty-card">Page principale</a>
          <a href="index.html#empty-card">Actualites</a>
        </div>
        <div class="nav-actions">
          <button class="notification-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
              <path d="M10 21h4"></path>
            </svg>
            <span class="notification-dot"></span>
          </button>
          <a class="nav-cta" href="index.html#empty-card">Retour</a>
          <span class="profile-avatar" role="img" aria-label="Profil CL">CL</span>
        </div>
      </nav>
    </header>

    <main class="news-detail container" aria-live="polite">
      <a class="back-link" href="index.html#empty-card">Retour aux signaux</a>
      <article id="news-content" class="news-article"></article>
    </main>
    <script>
      const searchInput = document.querySelector('#header-search');
      const searchClear = document.querySelector('[data-search-clear]');
      searchInput.addEventListener('input', () => {
        searchClear.hidden = !searchInput.value;
      });
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchClear.hidden = true;
        searchInput.focus();
      });
    </script>
    <script src="news.js"></script>
  </body>
</html>
